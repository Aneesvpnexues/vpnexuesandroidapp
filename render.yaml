services:
  - type: web
    name: vpnexues-backend
    runtime: java
    buildCommand: "./mvnw -DskipTests clean package"
    startCommand: "java -jar target/*.jar --spring.profiles.active=render"
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx512m"
      - key: DATABASE_URL
        fromDatabase:
          name: vpnexues-db
          property: connectionString
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: vpnexues-db
    plan: free
    databaseName: vpnexues
    ipAllowList: []
