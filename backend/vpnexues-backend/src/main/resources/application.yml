server:
  port: ${PORT:8080}
spring:
  application:
    name: vpnexues-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vpnexues}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
jwt:
  secret: ${JWT_SECRET:change-me-to-a-secure-random-string}
  expiration: 86400000
app:
  email:
    from: ${SMTP_USERNAME:}
