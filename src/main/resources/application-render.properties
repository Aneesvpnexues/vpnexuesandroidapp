# Render Production Profile
# Activated via SPRING_PROFILES_ACTIVE=render

# PostgreSQL (Render provides DATABASE_URL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Parse Render's DATABASE_URL into username/password
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Server port (Render sets PORT)
server.port=${PORT:8080}

# CORS - allow all origins in production
app.cors.allowed-origins=*

# Gmail SMTP (same as dev)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:sachinvpnexues@gmail.com}
spring.mail.password=${SMTP_PASSWORD:pwkucdlxvaptwaam}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
